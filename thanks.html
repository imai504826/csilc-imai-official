<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 | 今井久一郎 社会保険労務士事務所</title>
    <style>
        :root {
            --primary-blue: #0068b7;
            --white: #ffffff;
            --text-dark: #333;
            --light-bg: #f4f7fa;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            padding: 100px 20px;
            background-color: var(--light-bg);
            color: var(--text-dark);
        }
        .message-box {
            background: var(--white);
            padding: 50px;
            border-radius: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: var(--primary-blue); margin-bottom: 20px; }
        p { margin-bottom: 30px; line-height: 1.8; }
        .btn-back {
            display: inline-block;
            padding: 15px 50px;
            background: var(--primary-blue);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <h1>送信が完了いたしました</h1>
        <p>お問い合わせいただき、誠にありがとうございます。<br>
        内容を確認の上、担当者より折り返しご連絡させていただきます。</p>
        <a href="index.html" class="btn-back">トップページへ戻る</a>
    </div>
</body>
</html>
